<!DOCTYPE html>
<html>
<head>
  <title>Nettech Helpdesk - Set New Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-left">
      <h1><i class="bi bi-headset"></i> NETTECH</h1>
      <h2>Choose a new password</h2>
      <p>Use at least 6 characters. You will use it the next time you log in.</p>
    </div>

    <div class="auth-right">
      <div class="auth-form">
        <h3>Set new password</h3>
        <p class="text-muted mb-4">Enter and confirm your new password</p>

        <p id="msg" class="text-center"></p>

        <label class="form-label">New Password</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="newPassword" class="form-control" placeholder="New password">
          <span class="input-group-text" style="cursor:pointer" onclick="togglePassword('newPassword', this)">
            <i class="bi bi-eye"></i>
          </span>
        </div>

        <label class="form-label">Confirm Password</label>
        <div class="input-group mb-4">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password">
          <span class="input-group-text" style="cursor:pointer" onclick="togglePassword('confirmPassword', this)">
            <i class="bi bi-eye"></i>
          </span>
        </div>

        <button onclick="resetPassword()" class="btn btn-primary w-100 py-2">Change Password</button>

        <p class="text-center mt-4 text-muted"><a href="index.html">Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
