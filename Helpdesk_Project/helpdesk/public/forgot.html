<!DOCTYPE html>
<html>
<head>
  <title>Nettech Helpdesk - Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-left">
      <h1><i class="bi bi-headset"></i> NETTECH</h1>
      <h2>Forgot your password?</h2>
      <p>Enter your registered email and we will send you a link to set a new password.</p>
    </div>

    <div class="auth-right">
      <div class="auth-form">
        <h3>Reset password</h3>
        <p class="text-muted mb-4">We'll email you a reset link</p>

        <p id="msg" class="text-center"></p>

        <label class="form-label">Email</label>
        <div class="input-group mb-4">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" class="form-control" placeholder="Enter your email address">
        </div>

        <button onclick="forgotPassword()" class="btn btn-primary w-100 py-2">Send Reset Link</button>

        <p class="text-center mt-4 text-muted"><a href="index.html">Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
